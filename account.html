<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="subscriptions.html" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="search-icon" id="searchToggle">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5 21.5 19 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </div>
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
    </div>
    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42a.25.25 0 0 1-.26-.25c0-.04.01-.08.03-.11L7.16 14Z"/></svg>
    </div>
  </div>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="products.html?cat=fivem">منتجات فايف إم</a>
  <a href="products.html?cat=discord">منتجات الديسكورد</a>
  <a href="subscriptions.html">الاشتراكات</a>
  <a href="terms.html">الشروط والأحكام</a>
  <a href="https://discord.gg/Pt7U4bcF7M">سيرفر الديسكورد</a>
</div>

<div class="dark-login">
  <div class="auth-box">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24" width="36" height="36">
        <path fill="white" d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
      </svg>
    </div>
    <div class="auth-title">مرحباً بك في CA Store</div>

    <div id="emailStep">
      <input type="email" id="emailInput" class="auth-input" placeholder="البريد الإلكتروني" autocomplete="email">
      <button class="auth-btn" onclick="sendCode()">إرسال رمز التحقق</button>
    </div>

    <div id="codeStep" style="display:none;">
      <p style="text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px;">تم إرسال رمز التحقق إلى بريدك الإلكتروني</p>
      <input type="text" id="codeInput" class="auth-input" placeholder="رمز التحقق المكوّن من 6 أرقام" maxlength="6">
      <button class="auth-btn" onclick="verifyLogin()">تأكيد الدخول</button>
      <button id="resendBtn" class="auth-btn" disabled style="margin-top:10px;opacity:.5;" onclick="resendCode()">إعادة الإرسال بعد <span id="countdown">60</span>s</button>
    </div>
  </div>
</div>

<div id="verifyToast" style="
  position:fixed;top:24px;left:50%;transform:translate(-50%,-20px);
  padding:12px 22px;border-radius:12px;
  background:var(--surface-2);border:1px solid var(--line-2);
  color:#fff;font-size:13.5px;font-weight:700;
  box-shadow:var(--shadow-md);
  opacity:0;visibility:hidden;z-index:300;
  transition:all .28s var(--ease);">
  تم الإرسال!
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="script.min.js"></script>
</body>
</html>
