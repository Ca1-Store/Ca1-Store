  <style>

    .auth-loading {

      opacity: 0.6;

      pointer-events: none;

    }

    .auth-loading::after {

      content: '';

      position: absolute;

      inset: 0;

      background: rgba(0,0,0,0.3);

      border-radius: inherit;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    .auth-loading::before {

      content: '';

      position: absolute;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 24px;

      height: 24px;

      border: 2px solid rgba(255,255,255,0.3);

      border-top-color: #fff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      z-index: 1;

    }

    @keyframes spin {

      to { transform: translate(-50%, -50%) rotate(360deg); }

    }

    .auth-error {

      color: var(--bad);

      font-size: 13px;

      margin-top: 8px;

      text-align: center;

      display: none;

    }

    .auth-error.show {

    .auth-success {

      display: none;

    .auth-success.show {

<script>

// Security: Validate URL to prevent open redirects
function isValidUrl(url) {
    try {
        const parsed = new URL(url);
        return parsed.protocol === "https:" || parsed.protocol === "http:";
    } catch {
        return false;
    }
}

// Security: Sanitize user input
function sanitizeInput(input) {
    const div = document.createElement('div');
    div.textContent = input;
    return div.innerHTML;
}

// Security: Generate CSRF token
function generateCSRFToken() {
    const array = new Uint32Array(4);
    window.crypto.getRandomValues(array);
    return Array.from(array, dec => ('0' + dec.toString(16)).substr(-2)).join('');
}

// Discord Login
async function loginWithDiscord() {
    const btn = document.getElementById("discordLoginBtn");
    const errorDiv = document.getElementById("authError");
    const successDiv = document.getElementById("authSuccess");
    
    btn.classList.add("auth-loading");
    errorDiv.classList.remove("show");
    successDiv.classList.remove("show");

    try {
        // Validate backend URL
        if (!isValidUrl(BACKEND_URL)) {
            throw new Error("Invalid backend URL");
        }

        // Generate CSRF token
        const csrfToken = generateCSRFToken();
        sessionStorage.setItem('csrf_token', csrfToken);

        // Get OAuth URL from backend
        const res = await fetch(`${BACKEND_URL}/auth/web/url`, {
            headers: {
                'X-CSRF-Token': csrfToken
            }
        });
        
        if (!res.ok) {
            throw new Error("Failed to connect to backend");
        }
        
        const data = await res.json();

        if (!data.url) {
            throw new Error("Failed to get OAuth URL");
        }

        // Validate OAuth URL
        if (!isValidUrl(data.url) || !data.url.includes('discord.com')) {
            throw new Error("Invalid OAuth URL");
        }

        // Redirect to Discord
        window.location.href = data.url;

    } catch (err) {
        console.error("Discord login error:", err);
        errorDiv.textContent = "فشل الاتصال بالسيرفر. حاول مرة أخرى.";
        errorDiv.classList.add("show");
        btn.classList.remove("auth-loading");
    }
}

// Check if user is already logged in
document.addEventListener('DOMContentLoaded', function() {
    const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
    if (user && user.discordId) {
        window.location.href = "index.html";
    }

    // Add event listener to login button
    const loginBtn = document.getElementById("discordLoginBtn");
    if (loginBtn) {
        loginBtn.addEventListener("click", loginWithDiscord);
    }

    // Check for callback code in URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get("code");

    if (code) {
        handleDiscordCallback(code);
    }
});

async function handleDiscordCallback(code) {
    const errorDiv = document.getElementById("authError");
    const successDiv = document.getElementById("authSuccess");
    const btn = document.getElementById("discordLoginBtn");

    btn.classList.add("auth-loading");
    errorDiv.classList.remove("show");
    successDiv.classList.remove("show");

    try {
        // Validate code
        if (!code || typeof code !== 'string' || code.length < 10) {
            throw new Error("Invalid authorization code");
        }

        // Validate backend URL
        if (!isValidUrl(BACKEND_URL)) {
            throw new Error("Invalid backend URL");
        }

        // Get CSRF token
        const csrfToken = sessionStorage.getItem('csrf_token');
        if (!csrfToken) {
            throw new Error("Security token missing");
        }

        const res = await fetch(`${BACKEND_URL}/auth/web/callback`, {
            method: "POST",
            headers: { 
                "Content-Type": "application/json",
                'X-CSRF-Token': csrfToken
            },
            body: JSON.stringify({ code })
        });

        if (!res.ok) {
            throw new Error("Failed to authenticate");
        }

        const data = await res.json();

        if (data.success) {
            // Validate user data
            if (!data.discordId || !data.username) {
                throw new Error("Invalid user data received");
            }

            // Save user data with security measures
            const userData = {
                discordId: sanitizeInput(data.discordId),
                username: sanitizeInput(data.username),
                avatar: data.avatar ? sanitizeInput(data.avatar) : null,
                plans: Array.isArray(data.plans) ? data.plans : [],
                token: data.token,
                loginTime: Date.now()
            };

            localStorage.setItem("loggedUser", JSON.stringify(userData));

            // Clear CSRF token
            sessionStorage.removeItem('csrf_token');

            successDiv.textContent = "تم تسجيل الدخول بنجاح! جاري التحويل...";
            successDiv.classList.add("show");

            // Redirect to home page
            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);

        } else {
            throw new Error(data.message || "فشل تسجيل الدخول");
        }

    } catch (err) {
        console.error("Callback error:", err);
        errorDiv.textContent = err.message || "فشل تسجيل الدخول. حاول مرة أخرى.";
        errorDiv.classList.add("show");
        btn.classList.remove("auth-loading");
        
        // Clear URL parameters
        window.history.replaceState({}, document.title, window.location.pathname);
    }
}


</script>
