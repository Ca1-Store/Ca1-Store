<div class="profile-dropdown" id="profileDropdown">

</div>

<div class="products-page">
  <aside class="sidebar">
    <h3>تصفية</h3>
    <div class="filter-group">
      <label>القسم</label>
      <select id="filterCategory">
        <option value="subscriptions" selected>الاشتراكات</option>
        <option value="all">كل الأقسام</option>
        <option value="fivem">فايف إم</option>
        <option value="discord">ديسكورد</option>
      </select>
    </div>
    <div class="filter-group">
      <label>السعر</label>
      <select id="filterPrice">
        <option value="all">كل الأسعار</option>
        <option value="low">أقل من 20</option>
        <option value="mid">من 20 إلى 50</option>
        <option value="high">أعلى من 50</option>
      </select>
    </div>
    <div class="filter-group">
      <label>الحالة</label>
      <select id="filterStatus">
        <option value="all">الكل</option>
        <option value="available">متاح</option>
        <option value="soon">قريبًا</option>
      </select>
    </div>
  </aside>
  <div class="products-grid" id="productsGrid"></div>
</div>

<div id="niceAlert" class="nice-alert">تمت الإضافة للسلة</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="script.min.js"></script>
<script>
/* ── Apply subscriptions filter on load ── */
(function() {
  const fc = document.getElementById("filterCategory");
  if (fc) { fc.value = "subscriptions"; applyFilters(); }
})();

const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user || !user.email) {
  document.getElementById("signinBtn") && (document.getElementById("signinBtn").style.display = "");
  document.getElementById("profileIcon") && (document.getElementById("profileIcon").style.display = "none");
} else {
  document.getElementById("signinBtn") && (document.getElementById("signinBtn").style.display = "none");
}
const _subProfileIcon = document.getElementById("profileIcon");
const _subProfileDropdown = document.getElementById("profileDropdown");
if (_subProfileIcon) {
  _subProfileIcon.addEventListener("click", () => {
    if (!user) { window.location.href = "account.html"; return; }
    _subProfileDropdown && _subProfileDropdown.classList.toggle("open");
  });
}
document.addEventListener("click", e => {
  if (_subProfileIcon && _subProfileDropdown && !_subProfileDropdown.contains(e.target) && !_subProfileIcon.contains(e.target))
    _subProfileDropdown.classList.remove("open");
});
function logout() { localStorage.removeItem("loggedUser"); window.location.href = "account.html"; }
</script>
</body>
</html>
