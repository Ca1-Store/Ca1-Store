<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاشتراكات — CA Store</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <a href="index.html">CA STORE</a>

  <nav>
    <a href="index.html">الرئيسية</a>
    <a href="products.html?cat=fivem">فايف إم</a>
    <a href="products.html?cat=discord">ديسكورد</a>
    <a href="subscriptions.html" class="active">الاشتراكات</a>
  </nav>

  <button id="signinBtn" onclick="location.href='account.html'">تسجيل الدخول</button>
  <div id="profileIcon">👤</div>
</header>

<div class="profile-dropdown" id="profileDropdown">
  <a href="profile.html">حسابي</a>
  <a href="orders.html">طلباتي</a>
  <a href="settings.html">الإعدادات</a>
  <a onclick="logout()" style="cursor:pointer">تسجيل الخروج</a>
</div>

<div class="products-page">
  <aside>
    <select id="filterCategory">
      <option value="subscriptions" selected>الاشتراكات</option>
      <option value="all">كل الأقسام</option>
      <option value="fivem">فايف إم</option>
      <option value="discord">ديسكورد</option>
    </select>

    <select id="filterPrice">
      <option value="all">كل الأسعار</option>
      <option value="low">أقل من 20</option>
      <option value="mid">20 - 50</option>
      <option value="high">أعلى من 50</option>
    </select>

    <select id="filterStatus">
      <option value="all">الكل</option>
      <option value="available">متاح</option>
      <option value="soon">قريبًا</option>
    </select>
  </aside>

  <div id="productsGrid"></div>
</div>

<div id="niceAlert">تمت الإضافة للسلة</div>

<script src="script.min.js"></script>

<script>
/* =========================
   AUTO FILTER SUBSCRIPTIONS
========================= */
(function () {
  const fc = document.getElementById("filterCategory");
  if (fc) {
    fc.value = "subscriptions";
    if (typeof applyFilters === "function") applyFilters();
  }
})();

/* =========================
   AUTH UI STATE (FIXED)
========================= */
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");

const signinBtn = document.getElementById("signinBtn");
const profileIcon = document.getElementById("profileIcon");

if (!user || !user.email) {
  if (signinBtn) signinBtn.style.display = "block";
  if (profileIcon) profileIcon.style.display = "none";
} else {
  if (signinBtn) signinBtn.style.display = "none";
  if (profileIcon) profileIcon.style.display = "block";
}

/* =========================
   PROFILE DROPDOWN (FIXED)
========================= */
const dropdown = document.getElementById("profileDropdown");

if (profileIcon && dropdown) {
  profileIcon.addEventListener("click", () => {
    if (!user) {
      location.href = "account.html";
      return;
    }
    dropdown.classList.toggle("show");
  });

  document.addEventListener("click", (e) => {
    if (!profileIcon.contains(e.target) && !dropdown.contains(e.target)) {
      dropdown.classList.remove("show");
    }
  });
}

/* =========================
   LOGOUT
========================= */
function logout() {
  localStorage.removeItem("loggedUser");
  sessionStorage.clear();
  location.href = "account.html";
}
</script>

</body>
</html>
