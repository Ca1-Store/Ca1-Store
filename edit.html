<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعديل الملف الشخصي — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <div class="header-actions">
    <a href="profile.html" class="back-btn">
      <i class="fa-solid fa-arrow-right"></i> رجوع
    </a>
  </div>
</header>

<div class="profile-page">
  <div class="profile-box edit-box">
    <div class="auth-title">تعديل الملف الشخصي</div>

    <div class="profile-field">
      <label class="profile-field-label">الاسم</label>
      <input type="text" id="editName" class="edit-input" placeholder="اسمك الكامل">
    </div>

    <div class="profile-field">
      <label class="profile-field-label">البريد الإلكتروني</label>
      <input type="email" id="editEmail" class="edit-input" placeholder="بريدك الإلكتروني"
             onclick="openEmailModal()">
      <span class="edit-icon" onclick="openEmailModal()"><i class="fa-solid fa-pen-to-square" style="color:var(--brand-light);font-size:16px;"></i></span>
    </div>

    <div class="profile-field">
      <label class="profile-field-label">رقم الهاتف</label>
      <input type="text" id="editPhone" class="edit-input" placeholder="رقم هاتفك">
    </div>

    <div class="profile-field">
      <label class="profile-field-label">البلد</label>
      <input type="text" id="editCountry" class="edit-input" placeholder="بلدك">
    </div>

    <button class="auth-btn" style="margin-top:8px;" onclick="saveProfile()">
      <i class="fa-solid fa-floppy-disk"></i> حفظ التغييرات
    </button>
  </div>
</div>

<!-- Email change modal -->
<div class="email-modal" id="emailModal">
  <div class="email-modal-box">
    <span class="close-email-modal" onclick="closeEmailModal()">✕</span>
    <h3>تغيير البريد الإلكتروني</h3>
    <div id="emailStep1">
      <label>البريد الجديد</label>
      <input type="email" id="newEmailInput" placeholder="البريد الإلكتروني الجديد">
      <button class="email-btn" onclick="sendEmailCode()">إرسال رمز التحقق</button>
    </div>
    <div id="emailStep2" style="display:none;">
      <label>رمز التحقق</label>
      <input type="text" id="emailCodeInput" placeholder="أدخل الرمز" maxlength="6">
      <button class="email-btn" onclick="verifyEmailCode()">تأكيد التغيير</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">تم الحفظ بنجاح ✓</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="script.min.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user) { window.location.href = "account.html"; }
else {
  document.getElementById("editName").value    = user.name    || "";
  document.getElementById("editEmail").value   = user.email   || "";
  document.getElementById("editPhone").value   = user.phone   || "";
  document.getElementById("editCountry").value = user.country || "";
}

function saveProfile() {
  const updated = {
    ...user,
    name:    document.getElementById("editName").value.trim(),
    phone:   document.getElementById("editPhone").value.trim(),
    country: document.getElementById("editCountry").value.trim()
  };
  localStorage.setItem("loggedUser", JSON.stringify(updated));
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => { t.classList.remove("show"); window.location.href = "profile.html"; }, 1600);
}

function openEmailModal()  { document.getElementById("emailModal").classList.add("show"); }
function closeEmailModal() { document.getElementById("emailModal").classList.remove("show"); }

let pendingCode = null;
let pendingEmail = null;
function sendEmailCode() {
  pendingEmail = document.getElementById("newEmailInput").value.trim();
  if (!pendingEmail) return;
  pendingCode = Math.floor(100000 + Math.random() * 900000).toString();
  if (typeof emailjs !== "undefined") {
    emailjs.send("service_id", "template_id", { to_email: pendingEmail, code: pendingCode });
  }
  document.getElementById("emailStep1").style.display = "none";
  document.getElementById("emailStep2").style.display = "";
}
function verifyEmailCode() {
  const entered = document.getElementById("emailCodeInput").value.trim();
  if (entered === pendingCode) {
    const updated = { ...user, email: pendingEmail };
    localStorage.setItem("loggedUser", JSON.stringify(updated));
    closeEmailModal();
    document.getElementById("editEmail").value = pendingEmail;
    const t = document.getElementById("toast");
    t.textContent = "تم تغيير البريد بنجاح ✓";
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2000);
  } else {
    document.getElementById("emailCodeInput").classList.add("shake");
    setTimeout(() => document.getElementById("emailCodeInput").classList.remove("shake"), 400);
  }
}
</script>
</body>
</html>
