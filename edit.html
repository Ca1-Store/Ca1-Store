<!-- نفس رأس الصفحة عندك بدون تغيير -->

<div class="profile-page">
  <div class="profile-box edit-box">

    <h2>تعديل الملف الشخصي</h2>

    <input id="editName" placeholder="الاسم">
    <input id="editEmail" placeholder="الإيميل" onclick="openEmailModal()">
    <input id="editPhone" placeholder="رقم الهاتف">
    <input id="editCountry" placeholder="البلد">

    <button class="btn" onclick="saveProfile()">حفظ</button>

  </div>
</div>

<!-- EMAIL MODAL -->
<div class="modal" id="emailModal">
  <div class="modal-box">

    <h3>تغيير البريد الإلكتروني</h3>

    <div id="step1">
      <input id="newEmail" placeholder="البريد الجديد">
      <button class="btn" onclick="sendCode()">إرسال رمز</button>
    </div>

    <div id="step2" style="display:none;">
      <input id="codeInput" placeholder="رمز التحقق">
      <button class="btn" onclick="verifyCode()">تأكيد</button>
    </div>

  </div>
</div>

<div class="toast" id="toast">تم الحفظ ✓</div>

<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user) window.location.href = "account.html";

document.getElementById("editName").value = user.name || "";
document.getElementById("editEmail").value = user.email || "";
document.getElementById("editPhone").value = user.phone || "";
document.getElementById("editCountry").value = user.country || "";

function saveProfile(){
  const updated = {
    ...user,
    name: document.getElementById("editName").value,
    phone: document.getElementById("editPhone").value,
    country: document.getElementById("editCountry").value
  };

  localStorage.setItem("loggedUser", JSON.stringify(updated));

  document.getElementById("toast").classList.add("show");

  setTimeout(() => {
    window.location.href = "profile.html";
  }, 1200);
}

/* EMAIL SYSTEM FIX */
let code = "";
let newEmail = "";

function openEmailModal(){
  document.getElementById("emailModal").classList.add("show");
}

function sendCode(){
  newEmail = document.getElementById("newEmail").value;
  code = Math.floor(100000 + Math.random() * 900000).toString();

  console.log("CODE:", code);

  document.getElementById("step1").style.display = "none";
  document.getElementById("step2").style.display = "block";
}

function verifyCode(){
  const input = document.getElementById("codeInput").value;

  if(input === code){
    user.email = newEmail;
    localStorage.setItem("loggedUser", JSON.stringify(user));

    document.getElementById("emailModal").classList.remove("show");

    document.getElementById("editEmail").value = newEmail;
    alert("تم تغيير البريد بنجاح");
  } else {
    alert("رمز خاطئ");
  }
}
</script>
