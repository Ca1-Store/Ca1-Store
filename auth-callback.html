<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#07080a"><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/site.css"><script src="js/i18n.js"></script><title>CA Store</title></head><body>
<div class="bg"></div><main style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:20px"><div><img src="assets/emblem.png" width="96" height="96" style="border-radius:50%;margin:0 auto 20px" alt=""><h2 id="t" style="font-weight:900" data-i="cb_wait"></h2><p id="m" style="color:var(--text-2);margin-top:8px" data-i="cb_wait_s"></p><div id="s" style="margin-top:18px"><span class="spinner"></span></div></div></main>
<script src="js/config.js"></script><script src="js/core.js"></script><script>
(async()=>{const {C,store,t}=CA,q=new URLSearchParams(location.search),code=q.get("code");
const fail=m=>{document.getElementById("t").textContent=t("cb_fail");document.getElementById("m").textContent=m;document.getElementById("s").innerHTML='<a class="btn btn-primary" href="index.html">'+t("back_home")+'</a>';};
if(!code)return fail(q.get("error_description")||t("cb_nocode"));
try{const r=await fetch(C.API+"/auth/web/callback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})}).then(r=>r.json());
if(!r.success)return fail(r.message||t("cb_fail"));store.set("ca_token",r.token);const back=store.get("ca_back")||"index.html";store.del("ca_back");location.replace(/^[\w\-.?=&%#]+$/.test(back)?back:"index.html");}catch{fail(t("cb_srv"));}})();
</script></body></html>
