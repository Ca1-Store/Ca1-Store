<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - CA Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 20px;
        }
        .error {
            color: #e74c3c;
            background: #fee;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .success {
            color: #27ae60;
            background: #efe;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>جاري تسجيل الدخول...</h2>
        <p>يرجى الانتظار قليلاً</p>
        <div id="message"></div>
    </div>

    <script src="config.js"></script>
    <script>
        const messageDiv = document.getElementById("message");

        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");
            const error = urlParams.get("error");

            if (error) {
                messageDiv.innerHTML = `<div class="error">فشل تسجيل الدخول: ${error}</div>`;
                setTimeout(() => {
                    window.location.href = "account.html";
                }, 3000);
                return;
            }

            if (!code) {
                messageDiv.innerHTML = `<div class="error">لم يتم استلام رمز التفويض</div>`;
                setTimeout(() => {
                    window.location.href = "account.html";
                }, 3000);
                return;
            }

            try {
                const res = await fetch(`${BACKEND_URL}/auth/web/callback`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code })
                });

                const data = await res.json();

                if (data.success) {
                    const userData = {
                        discordId: data.discordId,
                        username: data.username,
                        avatar: data.avatar,
                        plans: data.plans,
                        token: data.token,
                        loginTime: Date.now()
                    };

                    localStorage.setItem("loggedUser", JSON.stringify(userData));

                    messageDiv.innerHTML = `<div class="success">تم تسجيل الدخول بنجاح! جاري التحويل...</div>`;

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1500);

                } else {
                    throw new Error(data.message || "فشل تسجيل الدخول");
                }

            } catch (err) {
                console.error("Callback error:", err);
                messageDiv.innerHTML = `<div class="error">${err.message || "فشل تسجيل الدخول. حاول مرة أخرى."}</div>`;
                setTimeout(() => {
                    window.location.href = "/account.html";
                }, 3000);
            }
        }

        handleCallback();
    </script>
</body>
</html>
