<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#07080a"><link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/site.css"><script src="js/i18n.js"></script><title>CA Store</title></head><body>
<header id="hdr"></header>
<main class="wrap" style="min-height:60vh;display:grid;place-items:center;padding:50px 0"><div class="cta-band" style="max-width:640px;width:100%" id="box"><span class="spinner" style="width:34px;height:34px;border-width:3px"></span><h2 style="margin-top:18px;font-size:24px" data-i="ret_wait"></h2><p data-i="ret_wait_s"></p></div></main>
<footer id="ftr"></footer><script src="js/config.js"></script><script src="js/core.js"></script>
<script>
(async()=>{const {t,$,api,auth,boot,icon,esc,C,isAr}=CA;await boot("");const box=$("#box"),q=new URLSearchParams(location.search),order=q.get("token");
const show=(ic,ti,m,btns)=>{box.innerHTML='<div class="icon-tile '+(ic==="check"?"ok":"")+'" style="margin:0 auto 18px;width:64px;height:64px">'+icon(ic,"xl")+'</div><h2 style="font-size:26px;font-weight:900;margin-bottom:10px">'+ti+'</h2><p style="margin-bottom:24px">'+m+'</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+btns+'</div>'};
if(!order)return show("info",t("ret_none"),t("ret_none_d"),'<a class="btn" href="store.html">'+t("back_store")+'</a>');
if(!auth.user)return show("lock",t("ret_login_t"),t("ret_login_d"),'<button class="btn btn-primary" id="lg">'+t("login")+'</button>'),$("#lg").onclick=()=>auth.login("checkout-return.html"+location.search);
try{const r=await api("/api/store/checkout/capture",{method:"POST",body:{orderId:order}});
 const name=(!isAr&&r.productTitleEn)?r.productTitleEn:r.productTitle;
 const delivered=r.plan?(r.roleGranted===false?t("ret_role_fail"):t("ret_role_ok")):t("ret_ticket");
 show("check",t("ret_ok_t"),t("ret_ok_d",{title:"<b>"+esc(name)+"</b>"})+"<br>"+esc(delivered),(r.productId?'<a class="btn btn-primary" href="product.html?id='+r.productId+'#reviewsSec">'+icon("star","sm")+" "+t("ret_rate")+'</a>':"")+'<a class="btn" href="my-orders.html">'+icon("box","sm")+" "+t("ret_orders")+'</a><a class="btn" href="store.html">'+t("back_store")+'</a>');
}catch(e){show("info",t("ret_fail"),esc(e.message),'<a class="btn" href="store.html">'+t("back_store")+'</a>');}})();
</script></body></html>
