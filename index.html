<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CA Store</title>
<meta name="description" content="CA Store — FiveM graphics packs & Discord services. Secure PayPal payment, delivery on Discord.">
<meta name="theme-color" content="#07080a">
<link rel="icon" href="assets/favicon.png"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preload" href="fonts/cairo-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/site.css">
<script src="js/i18n.js"></script>
</head>
<body>
<header id="hdr"></header>
<main>
<section class="hero"><div class="wrap hero-grid">
  <div>
    <span class="eyebrow" data-i="hero_eyebrow"></span>
    <h1><span data-i="hero_a"></span> <em data-i="hero_em"></em> <span data-i="hero_b"></span></h1>
    <p class="lead" data-i="hero_lead"></p>
    <div class="hero-cta"><a class="btn btn-primary btn-lg" href="store.html" data-i="browse_store"></a><a class="btn btn-lg" href="#how" data-i="how_q"></a></div>
    <div class="hero-stats">
      <div><b id="stCustomers">—</b><span data-i="st_customers"></span></div>
      <div><b id="stSales">—</b><span data-i="st_sales"></span></div>
      <div><b id="stAvg">—</b><span data-i="st_rating"></span></div>
    </div>
  </div>
  <div class="hero-art">
    <div class="glow"></div><div class="ring r2"></div><div class="ring r1"></div><div class="ring r3"></div>
    <div class="orbit"><span class="node"></span></div><div class="orbit o2"><span class="node" style="width:7px;height:7px"></span></div>
    <img class="emblem" src="assets/emblem.png" alt="CA Store">
    <div class="float-card fc1"><span id="fi1"></span><div><span data-i="fc1_t"></span><small data-i="fc1_s"></small></div></div>
    <div class="float-card fc2"><span id="fi2"></span><div><span data-i="fc2_t"></span><small data-i="fc2_s"></small></div></div>
    <div class="float-card fc3"><span id="fi3"></span><div><span data-i="fc3_t"></span><small data-i="fc3_s"></small></div></div>
  </div>
</div></section>

<div class="marquee" aria-hidden="true"><div class="marquee-track" id="mq"></div></div>

<section class="section"><div class="wrap">
  <div class="sec-head rv-in"><div><span class="eyebrow" data-i="feat_eyebrow"></span><h2 class="sec-title" data-i="feat_title"></h2></div><a class="btn" href="store.html"><span data-i="view_all"></span> <span id="arr1"></span></a></div>
  <div class="grid" id="featured"></div>
</div></section>

<section class="section tight hidden" id="offersSec"><div class="wrap">
  <div class="sec-head rv-in"><div><span class="eyebrow" data-i="offers_eyebrow"></span><h2 class="sec-title" data-i="offers_title"></h2></div></div>
  <div class="grid" id="offers"></div>
</div></section>

<section class="section tight hidden" id="diffSec"><div class="wrap">
  <div class="sec-head rv-in"><div><span class="eyebrow" data-i="diff_eyebrow"></span><h2 class="sec-title" data-i="diff_title"></h2><p class="sec-sub" data-i="diff_sub"></p></div><a class="btn" id="diffLink" href="store.html" data-i="view_all"></a></div>
  <div id="diff"></div>
</div></section>

<section class="section tight"><div class="wrap">
  <div class="sec-head rv-in"><div><span class="eyebrow" data-i="cats_eyebrow"></span><h2 class="sec-title" data-i="cats_title"></h2></div></div>
  <div class="cats rv-in" id="cats"></div>
</div></section>

<section class="section" id="how"><div class="wrap">
  <div class="sec-head rv-in" style="justify-content:center;text-align:center"><div><span class="eyebrow" data-i="how_eyebrow"></span><h2 class="sec-title" data-i="how_title"></h2></div></div>
  <div class="steps rv-in" id="steps"></div>
</div></section>

<section class="section tight"><div class="wrap">
  <div class="sec-head rv-in"><div><span class="eyebrow" data-i="why_eyebrow"></span><h2 class="sec-title" data-i="why_title"></h2></div></div>
  <div class="feat-grid rv-in" id="feats"></div>
</div></section>

<section class="section"><div class="wrap">
  <div class="sec-head rv-in"><div><span class="eyebrow" data-i="rv_eyebrow"></span><h2 class="sec-title" data-i="rv_title"></h2><p class="sec-sub" data-i="rv_sub"></p></div><a class="btn" href="reviews.html" data-i="rv_all"></a></div>
  <div class="rv-grid" id="reviews"></div>
</div></section>

<section class="section tight" id="faq"><div class="wrap">
  <div class="sec-head rv-in" style="justify-content:center;text-align:center"><div><span class="eyebrow" data-i="faq_eyebrow"></span><h2 class="sec-title" data-i="faq_title"></h2></div></div>
  <div class="faq rv-in" id="faqList"></div>
</div></section>

<section class="section tight"><div class="wrap"><div class="cta-band rv-in"><h2 data-i="cta_t"></h2><p data-i="cta_s"></p><a class="btn btn-primary btn-lg" href="store.html" data-i="cta_b"></a></div></div></section>
</main>
<footer id="ftr"></footer>
<script src="js/config.js"></script><script src="js/core.js"></script><script src="js/home.js"></script>
</body></html>
