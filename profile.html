<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حسابي — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="subscriptions.html" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42a.25.25 0 0 1-.26-.25c0-.04.01-.08.03-.11L7.16 14Z"/></svg>
    </div>
  </div>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="products.html?cat=fivem">منتجات فايف إم</a>
  <a href="orders.html">طلباتي</a>
  <a href="settings.html">الإعدادات</a>
  <a href="terms.html">الشروط والأحكام</a>
</div>

<div class="profile-page">
  <div class="profile-box">
    <h2>معلومات الحساب</h2>
    <div id="profileInfo">
      <div>
        <span class="profile-field-label">الاسم</span>
        <span class="profile-field-value" id="pName">—</span>
      </div>
      <div>
        <span class="profile-field-label">البريد الإلكتروني</span>
        <span class="profile-field-value" id="pEmail">—</span>
      </div>
      <div>
        <span class="profile-field-label">رقم الهاتف</span>
        <span class="profile-field-value" id="pPhone">—</span>
      </div>
      <div>
        <span class="profile-field-label">البلد</span>
        <span class="profile-field-value" id="pCountry">—</span>
      </div>
    </div>
  </div>

  <div class="profile-box">
    <button class="profile-btn edit-btn" onclick="window.location.href='edit.html'">
      <i class="fa-solid fa-pen"></i> تعديل الملف الشخصي
    </button>
    <button class="profile-btn edit-btn" onclick="window.location.href='orders.html'">
      <i class="fa-solid fa-bag-shopping"></i> طلباتي
    </button>
    <button class="profile-btn edit-btn" onclick="window.location.href='settings.html'">
      <i class="fa-solid fa-gear"></i> الإعدادات
    </button>
    <button class="profile-btn logout-btn" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
    </button>
  </div>
</div>

<script src="script.min.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user) { window.location.href = "account.html"; }
else {
  document.getElementById("pName").textContent    = user.name    || "—";
  document.getElementById("pEmail").textContent   = user.email   || "—";
  document.getElementById("pPhone").textContent   = user.phone   || "—";
  document.getElementById("pCountry").textContent = user.country || "—";
}
function logout() {
  localStorage.removeItem("loggedUser");
  window.location.href = "account.html";
}
</script>
</body>
</html>
