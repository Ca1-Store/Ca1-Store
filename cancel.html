<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تم الإلغاء — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
</header>

<div style="min-height:100vh;display:grid;place-items:center;padding:calc(var(--header-h)+40px) 24px 60px;">
  <div style="text-align:center;max-width:480px;">
    <div style="
      width:88px;height:88px;margin:0 auto 22px;
      border-radius:50%;
      background:linear-gradient(135deg,#EF4444,#DC2626);
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 0 28px rgba(239,68,68,.4);">
      <i class="fa-solid fa-xmark" style="font-size:38px;color:#fff;"></i>
    </div>
    <h2 style="font-size:26px;margin:0 0 12px;color:#fff;background:none;-webkit-text-fill-color:#fff;">تم إلغاء العملية</h2>
    <p style="color:var(--muted);margin:0 0 28px;">لم تُكتمل عملية الدفع. يمكنك المحاولة مجدداً في أي وقت.</p>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;">
      <a href="products.html" style="
        display:inline-flex;align-items:center;gap:8px;
        padding:13px 24px;border-radius:13px;
        background:linear-gradient(135deg,var(--brand),var(--brand-2));
        color:#fff;font-weight:700;
        box-shadow:0 10px 26px var(--brand-glow);
        transition:.25s var(--ease);">
        العودة للمنتجات
      </a>
      <a href="index.html" style="
        display:inline-flex;align-items:center;gap:8px;
        padding:13px 24px;border-radius:13px;
        background:rgba(255,255,255,.05);
        border:1px solid var(--line-2);
        color:var(--ink-soft);font-weight:700;
        transition:.25s var(--ease);">
        الصفحة الرئيسية
      </a>
    </div>
  </div>
</div>

<script src="script.min.js"></script>
</body>
</html>
