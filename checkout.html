<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة الشراء — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="subscriptions.html" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="search-icon" id="searchToggle">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5 21.5 19 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </div>
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
    </div>
    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42a.25.25 0 0 1-.26-.25c0-.04.01-.08.03-.11L7.16 14Z"/></svg>
    </div>
    <div class="profile-icon" id="profileIcon">
      <svg viewBox="0 0 24 24"><path fill="white" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></svg>
    </div>
    <button class="signin-btn" id="signinBtn" onclick="window.location.href='account.html'">تسجيل الدخول</button>
  </div>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<!-- Profile Panel -->
<div class="profile-panel-overlay" id="profilePanelOverlay"></div>
<div class="profile-panel" id="profilePanel">
  <div class="panel-header">
    <div class="panel-title">الملف الشخصي</div>
    <button class="panel-close" id="closePanelBtn">✕</button>
  </div>
  <div class="panel-avatar-section">
    <div class="panel-avatar" id="panelAvatar">CA</div>
    <div class="panel-name" id="panelName">مستخدم CA</div>
    <div class="panel-email" id="panelEmail">غير مسجّل</div>
  </div>
  <nav class="panel-nav">
    <a href="profile.html" class="panel-link"><i class="fa-solid fa-user"></i><span>حسابي</span><i class="fa-solid fa-chevron-left panel-chevron"></i></a>
    <a href="orders.html" class="panel-link"><i class="fa-solid fa-bag-shopping"></i><span>طلباتي</span><i class="fa-solid fa-chevron-left panel-chevron"></i></a>
    <a href="settings.html" class="panel-link"><i class="fa-solid fa-gear"></i><span>الإعدادات</span><i class="fa-solid fa-chevron-left panel-chevron"></i></a>
  </nav>
  <div class="panel-footer">
    <button class="panel-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
  </div>
</div>
<div class="profile-dropdown" id="profileDropdown" style="display:none;"></div>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="products.html?cat=fivem">منتجات فايف إم</a>
  <a href="products.html?cat=discord">منتجات الديسكورد</a>
  <a href="subscriptions.html">الاشتراكات</a>
  <a href="terms.html">الشروط والأحكام</a>
</div>

<div class="checkout-page">
  <div class="checkout-full">
    <h2><i class="fa-solid fa-cart-shopping" style="color:var(--brand-light);margin-left:12px;font-size:22px;"></i>سلة الشراء</h2>
    <div id="cartItems"></div>

    <!-- Summary box — shown only when cart has items -->
    <div class="cart-summary" id="cartSummary" style="display:none;">
      <div class="summary-row">
        <span>إجمالي المنتجات</span>
        <span id="summaryCount">0 منتج</span>
      </div>
      <div class="summary-row total">
        <span>المجموع الكلي</span>
        <span id="summaryTotal" style="color:var(--gold);font-size:18px;font-weight:800;">0 ر.س</span>
      </div>
      <button class="cta-primary" style="width:100%;justify-content:center;margin-top:6px;" id="confirmOrderBtn" onclick="confirmOrder()">
        <i class="fa-solid fa-bolt"></i>
        الدفع والشراء الآن
      </button>
      <button onclick="clearCart()" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.22);color:#fca5a5;font-weight:700;font-size:14px;cursor:pointer;font-family:Almarai,sans-serif;">
        <i class="fa-solid fa-trash-can" style="margin-left:7px;"></i>
        إفراغ السلة
      </button>
    </div>
  </div>
</div>

<div id="niceAlert" class="nice-alert"></div>

<style>
.checkout-page { max-width: 820px; margin: 60px auto; padding: 0 20px 80px; }
.checkout-full h2 { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 28px; display: flex; align-items: center; }
.cart-empty-box {
  text-align: center; padding: 80px 20px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
}
.cart-empty-box i { font-size: 52px; color: var(--muted-2); margin-bottom: 20px; display: block; }
.cart-empty-box p { color: var(--muted); font-size: 16px; margin-bottom: 22px; }
.cart-item {
  display: flex; align-items: center; gap: 18px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 18px; padding: 16px 18px; margin-bottom: 14px;
  transition: border-color .2s;
}
.cart-item:hover { border-color: rgba(124,58,237,.3); }
.cart-item img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; background: var(--bg-2); flex-shrink: 0; }
.cart-item-info { flex: 1; }
.cart-item-title { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 5px; }
.cart-item-price { font-size: 14px; color: var(--gold); font-weight: 700; }
.cart-item-qty {
  display: flex; align-items: center; gap: 10px;
}
.qty-btn {
  width: 32px; height: 32px; border-radius: 9px;
  background: rgba(124,58,237,.12); border: 1px solid rgba(124,58,237,.25);
  color: var(--brand-light); font-size: 16px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s;
}
.qty-btn:hover { background: rgba(124,58,237,.25); }
.qty-num { font-size: 16px; font-weight: 800; color: #fff; min-width: 22px; text-align: center; }
.cart-item-remove {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
  background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.18);
  color: #fca5a5; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .2s;
}
.cart-item-remove:hover { background: rgba(239,68,68,.2); color: #fff; }
.cart-summary {
  margin-top: 24px; background: var(--surface); border: 1px solid rgba(124,58,237,.2);
  border-radius: 18px; padding: 22px 20px;
}
.summary-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--line);
  color: var(--ink-soft); font-size: 14px; font-weight: 700;
}
.summary-row:last-of-type { border-bottom: none; }
.summary-row.total { padding-top: 14px; }
</style>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="script.min.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user || !user.email) {
  document.getElementById("signinBtn").style.display = "";
  document.getElementById("profileIcon").style.display = "none";
} else {
  document.getElementById("signinBtn").style.display = "none";
  document.getElementById("panelEmail").textContent = user.email;
  if (user.name) document.getElementById("panelName").textContent = user.name;
  document.getElementById("panelAvatar").textContent = (user.name || user.email).slice(0,2).toUpperCase();
}

const profileIcon = document.getElementById("profileIcon");
const profilePanel = document.getElementById("profilePanel");
const profilePanelOverlay = document.getElementById("profilePanelOverlay");
if (profileIcon) {
  profileIcon.addEventListener("click", () => {
    if (!user) { window.location.href = "account.html"; return; }
    profilePanel.classList.add("open"); profilePanelOverlay.classList.add("open"); document.body.style.overflow = "hidden";
  });
}
profilePanelOverlay.addEventListener("click", () => { profilePanel.classList.remove("open"); profilePanelOverlay.classList.remove("open"); document.body.style.overflow = ""; });
document.getElementById("closePanelBtn").addEventListener("click", () => { profilePanel.classList.remove("open"); profilePanelOverlay.classList.remove("open"); document.body.style.overflow = ""; });
function logout() { localStorage.removeItem("loggedUser"); window.location.href = "account.html"; }

/* ─── CART RENDERING ─── */
function getCart() { return JSON.parse(localStorage.getItem("cart") || "[]"); }
function saveCart(c) { localStorage.setItem("cart", JSON.stringify(c)); }

function renderCartPage() {
  const cart = getCart();
  const container = document.getElementById("cartItems");
  const summary = document.getElementById("cartSummary");

  if (!cart.length) {
    container.innerHTML = `
      <div class="cart-empty-box">
        <i class="fa-solid fa-cart-shopping"></i>
        <p>سلتك فارغة — تصفح منتجاتنا وأضف ما يعجبك!</p>
        <a href="index.html#productsSection" class="cta-primary" style="display:inline-flex;gap:9px;align-items:center;">
          <i class="fa-solid fa-store"></i> تصفح المنتجات
        </a>
      </div>`;
    summary.style.display = "none";
    return;
  }

  container.innerHTML = cart.map((item, idx) => `
    <div class="cart-item">
      <img src="${item.image || ''}" alt="${item.title}" onerror="this.style.display='none'">
      <div class="cart-item-info">
        <div class="cart-item-title">${item.title}</div>
        <div class="cart-item-price">${(item.price * item.qty).toFixed(2)} ر.س</div>
      </div>
      <div class="cart-item-qty">
        <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
      </div>
      <button class="cart-item-remove" onclick="removeItem(${idx})" title="حذف"><i class="fa-solid fa-xmark"></i></button>
    </div>
  `).join("");

  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("summaryCount").textContent = count + " منتج";
  document.getElementById("summaryTotal").textContent = total.toFixed(2) + " ر.س";
  summary.style.display = "block";
  updateCartCount();
}

function changeQty(idx, delta) {
  const cart = getCart();
  cart[idx].qty = Math.max(1, cart[idx].qty + delta);
  saveCart(cart);
  renderCartPage();
}

function removeItem(idx) {
  const cart = getCart();
  cart.splice(idx, 1);
  saveCart(cart);
  renderCartPage();
}

function clearCart() {
  saveCart([]);
  renderCartPage();
}

function confirmOrder() {
  const cart = getCart();
  if (!cart.length) return;
  if (!user || !user.email) { window.location.href = "account.html"; return; }
  if (cart.length === 1 && cart[0].paypalUrl) {
    window.location.href = cart[0].paypalUrl;
  } else {
    showNiceAlert("يرجى الشراء منتجاً منتجاً عبر زر 'شراء الآن' في صفحة المنتج");
  }
}

renderCartPage();
</script>
</body>
</html>
