<style>

.cart-item{

.cart-item-info{

  flex:1;

.cart-item-title{

  display:flex;

.qty-btn{

  width:32px;

  border:1px solid rgba(124,58,237,.25);

  color:var(--brand-light);

  font-size:16px;

  font-weight:800;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  transition:all .2s;

}



.qty-btn:hover{

  background:rgba(124,58,237,.25);

}

  font-size:16px;

  font-weight:800;

  color:#fff;

  min-width:22px;

  text-align:center;

}

  width:34px;

  height:34px;

  border-radius:9px;

  flex-shrink:0;

  background:rgba(239,68,68,.08);

  border:1px solid rgba(239,68,68,.18);

  color:#fca5a5;

  color:#fff;

  margin-top:24px;

  background:var(--surface);

  border:1px solid rgba(124,58,237,.2);

  border-radius:18px;

  padding:22px 20px;

}



.summary-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:10px 0;

  border-bottom:1px solid var(--line);

  color:var(--ink-soft);

  font-size:14px;

  font-weight:700;

  border-bottom:none;

}

  padding-top:14px;

}

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>



<script src="Email.JS"></script>



<script src="script.min.js"></script>



<script>



const user = JSON.parse(localStorage.getItem("loggedUser") || "null");



if (!user || !user.email) {



  document.getElementById("signinBtn").style.display = "";

  document.getElementById("profileIcon").style.display = "none";



} else {



  document.getElementById("signinBtn").style.display = "none";



  document.getElementById("panelEmail").textContent = user.email;



  if (user.name) {

    document.getElementById("panelName").textContent = user.name;

  }



  document.getElementById("panelAvatar").textContent =

    (user.name || user.email).slice(0,2).toUpperCase();

}



/* PROFILE PANEL */



const profileIcon = document.getElementById("profileIcon");

const profilePanel = document.getElementById("profilePanel");

const profilePanelOverlay = document.getElementById("profilePanelOverlay");



if (profileIcon) {



  profileIcon.addEventListener("click", () => {



    if (!user) {

      window.location.href = "account.html";

      return;

    }



    profilePanel.classList.add("open");

    profilePanelOverlay.classList.add("open");



    document.body.style.overflow = "hidden";

  });

}



profilePanelOverlay.addEventListener("click", () => {



  profilePanel.classList.remove("open");

  profilePanelOverlay.classList.remove("open");



  document.body.style.overflow = "";

});



document.getElementById("closePanelBtn").addEventListener("click", () => {



  profilePanel.classList.remove("open");

  profilePanelOverlay.classList.remove("open");



  document.body.style.overflow = "";

});



function logout() {



  localStorage.removeItem("loggedUser");



  window.location.href = "account.html";

}



/* CART */



function getCart() {

  return JSON.parse(localStorage.getItem("cart") || "[]");

}



function saveCart(c) {

  localStorage.setItem("cart", JSON.stringify(c));

}



function renderCartPage() {



  const cart = getCart();



  const container = document.getElementById("cartItems");



  const summary = document.getElementById("cartSummary");



  if (!cart.length) {



    container.innerHTML = `

      <div class="cart-empty-box">



        <i class="fa-solid fa-cart-shopping"></i>



        <p>

          سلتك فارغة — تصفح منتجاتنا وأضف ما يعجبك!

        </p>



        <a href="index.html#productsSection"

           class="cta-primary"

           style="display:inline-flex;gap:9px;align-items:center;">



          <i class="fa-solid fa-store"></i>



          تصفح المنتجات



        </a>



      </div>

    `;



    summary.style.display = "none";



    return;

  }



  container.innerHTML = cart.map((item, idx) => `



    <div class="cart-item">



      <img

        src="${item.image || ''}"

        alt="${item.title}"

        onerror="this.style.display='none'"

      >



      <div class="cart-item-info">



        <div class="cart-item-title">

          ${item.title}

        </div>



        <div class="cart-item-price">

          ${(item.price * item.qty).toFixed(2)} ر.س

        </div>



      </div>



      <div class="cart-item-qty">



        <button class="qty-btn"

                onclick="changeQty(${idx}, -1)">

          −

        </button>



        <span class="qty-num">

          ${item.qty}

        </span>



        <button class="qty-btn"

                onclick="changeQty(${idx}, 1)">

          +

        </button>



      </div>



      <button class="cart-item-remove"

              onclick="removeItem(${idx})"

              title="حذف">



        <i class="fa-solid fa-xmark"></i>



      </button>



    </div>



  `).join("");



  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);



  const count = cart.reduce((s, i) => s + i.qty, 0);



  document.getElementById("summaryCount").textContent =

    count + " منتج";



  document.getElementById("summaryTotal").textContent =

    total.toFixed(2) + " ر.س";



  summary.style.display = "block";



  updateCartCount();

}



function changeQty(idx, delta) {



  const cart = getCart();



  cart[idx].qty = Math.max(1, cart[idx].qty + delta);



  saveCart(cart);



  renderCartPage();

}



function removeItem(idx) {



  const cart = getCart();



  cart.splice(idx, 1);



  saveCart(cart);



  renderCartPage();

}



function clearCart() {



  saveCart([]);



  renderCartPage();

}



/* FINAL FIXED CHECKOUT */



function confirmOrder() {



  const cart = getCart();



  if (!cart.length) return;



  if (!user || !user.email) {



    window.location.href = "account.html";



    return;

  }



  if (cart.length > 1) {



    showNiceAlert("حالياً يمكنك شراء منتج واحد فقط بكل عملية");



    return;

  }



  const item = cart[0];



  const product = productsData.find(p => p.id === item.id);



  if (!product || !product.paypal) {



    showNiceAlert("رابط الدفع غير متوفر لهذا المنتج");



    return;

  }



  window.location.href = product.paypal;

}



renderCartPage();



// Side Menu Functions

function toggleSideMenu() {

  const sideMenu = document.getElementById('sideMenu');

  const sideMenuOverlay = document.getElementById('sideMenuOverlay');

  

  if (sideMenu) {

    sideMenu.classList.toggle('open');

    document.body.style.overflow = sideMenu.classList.contains('open') ? 'hidden' : '';

    

    if (sideMenuOverlay) {

      sideMenuOverlay.classList.toggle('show');

    }

  }

}



function sideMenuLogout() {

  localStorage.removeItem("loggedUser");

  toggleSideMenu();

  setTimeout(() => {

    window.location.href = "account.html";

  }, 300);

}



function updateSideMenuUserInfo() {

  const user = JSON.parse(localStorage.getItem('loggedUser') || 'null');

  

  if (user) {

    const avatar = document.getElementById('sideMenuAvatar');

    const userName = document.getElementById('sideMenuUserName');

    const userEmail = document.getElementById('sideMenuUserEmail');



    if (avatar) {

      const displayName = user.name || user.email || 'CA';

      avatar.textContent = displayName.slice(0, 2).toUpperCase();

    }



    if (userName) {

      userName.textContent = user.name || 'مستخدم CA';

    }



    if (userEmail) {

      userEmail.textContent = user.email || 'غير معروف';

    }

  }

}



updateSideMenuUserInfo();



</script>
