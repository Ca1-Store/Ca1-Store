<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة الشراء — CA Store</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <a href="index.html">CA STORE</a>

  <button id="signinBtn" onclick="location.href='account.html'">تسجيل الدخول</button>
  <div id="profileIcon">👤</div>
</header>

<div class="checkout-page">
  <div id="cartItems"></div>

  <div id="cartSummary" style="display:none;">
    <div id="summaryCount"></div>
    <div id="summaryTotal"></div>
    <button onclick="confirmOrder()">الدفع</button>
    <button onclick="clearCart()">إفراغ السلة</button>
  </div>
</div>

<script src="script.min.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");

const signinBtn = document.getElementById("signinBtn");
const profileIcon = document.getElementById("profileIcon");

if (!user || !user.email) {
  signinBtn.style.display = "block";
  profileIcon.style.display = "none";
} else {
  signinBtn.style.display = "none";
  profileIcon.style.display = "block";
}

function getCart() {
  return JSON.parse(localStorage.getItem("cart") || "[]");
}

function saveCart(c) {
  localStorage.setItem("cart", JSON.stringify(c));
}

function renderCartPage() {
  const cart = getCart().filter(i => i && !isNaN(Number(i.price)));
  const container = document.getElementById("cartItems");
  const summary = document.getElementById("cartSummary");

  if (!cart.length) {
    container.innerHTML = "<p>السلة فارغة</p>";
    summary.style.display = "none";
    return;
  }

  container.innerHTML = cart.map((item, idx) => `
    <div>
      <h3>${item.title}</h3>
      <p>${Number(item.price) * item.qty} ر.س</p>
      <button onclick="changeQty(${idx},-1)">-</button>
      <span>${item.qty}</span>
      <button onclick="changeQty(${idx},1)">+</button>
      <button onclick="removeItem(${idx})">حذف</button>
    </div>
  `).join("");

  const total = cart.reduce((s,i)=> s + Number(i.price)*i.qty,0);
  const count = cart.reduce((s,i)=> s + i.qty,0);

  document.getElementById("summaryCount").textContent = count + " منتج";
  document.getElementById("summaryTotal").textContent = total.toFixed(2) + " ر.س";
  summary.style.display = "block";
}

function changeQty(i,d){
  const cart = getCart();
  cart[i].qty = Math.max(1, cart[i].qty + d);
  saveCart(cart);
  renderCartPage();
}

function removeItem(i){
  const cart = getCart();
  cart.splice(i,1);
  saveCart(cart);
  renderCartPage();
}

function clearCart(){
  saveCart([]);
  renderCartPage();
}

function confirmOrder(){
  const cart = getCart();
  if (!user) return location.href="account.html";
  if (!cart.length) return;
  if (cart[0].paypalUrl) location.href = cart[0].paypalUrl;
}

renderCartPage();
</script>

</body>
</html>
