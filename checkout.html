<style>

  align-items:center;

  border-radius:22px;

  margin-bottom:20px;

.cart-item-info{

.cart-item-price{

.cart-item-qty{

.qty-btn{

  border:1px solid rgba(124,58,237,.25);

  color:var(--brand-light);

  font-size:16px;

  font-weight:800;

  display:flex;

  align-items:center;

  justify-content:center;

  cursor:pointer;

  transition:all .2s;

}



.qty-btn:hover{

  background:rgba(124,58,237,.25);

}

  font-size:16px;

  font-weight:800;

  color:#fff;

  min-width:22px;

  text-align:center;

}

  width:34px;

  height:34px;

  border-radius:9px;

  flex-shrink:0;

  border:1px solid rgba(239,68,68,.18);

  color:#fca5a5;

  color:#fff;

  margin-top:24px;

  border:1px solid rgba(124,58,237,.2);

  border-radius:18px;

  padding:22px 20px;

.summary-row{

  display:flex;

  justify-content:space-between;

  align-items:center;

  border-bottom:1px solid var(--line);

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>



<script src="Email.JS"></script>



<script src="script.min.js"></script>



<script>



const user = JSON.parse(localStorage.getItem("loggedUser") || "null");



if (!user || !user.discordId) {



  document.getElementById("signinBtn").style.display = "";

  document.getElementById("profileIcon").style.display = "none";



} else {



  document.getElementById("signinBtn").style.display = "none";



  const panelEmail = document.getElementById("panelEmail");
  if (panelEmail) {
    panelEmail.textContent = user.username || "Discord User";
  }

  if (user.name) {
    const panelName = document.getElementById("panelName");
    if (panelName) {
      panelName.textContent = user.name;
    }
  }

  const panelAvatar = document.getElementById("panelAvatar");
  if (panelAvatar) {
    if (user.avatar) {
      panelAvatar.innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
    } else {
      panelAvatar.textContent = (user.username || "CA").slice(0,2).toUpperCase();
    }
  }

}



function logout() {



  localStorage.removeItem("loggedUser");



  window.location.href = "account.html";

}



/* CART */



function getCart() {

  return JSON.parse(localStorage.getItem("cart") || "[]");

}



function saveCart(c) {

  localStorage.setItem("cart", JSON.stringify(c));

}



function renderCartPage() {



  const cart = getCart();



  const container = document.getElementById("cartItems");



  const summary = document.getElementById("cartSummary");



  if (!cart.length) {



    container.innerHTML = `

      <div class="cart-empty-box">



        <i class="fa-solid fa-cart-shopping"></i>



        <p>

          سلتك فارغة — تصفح منتجاتنا وأضف ما يعجبك!

        </p>



        <a href="index.html#productsSection"

           class="cta-primary"

           style="display:inline-flex;gap:9px;align-items:center;">



          <i class="fa-solid fa-store"></i>



          تصفح المنتجات



        </a>



      </div>

    `;



    summary.style.display = "none";



    return;

  }



  container.innerHTML = cart.map((item, idx) => `



    <div class="cart-item">



      <img

        src="${item.image || ''}"

        alt="${item.title}"

        onerror="this.style.display='none'"

      >



      <div class="cart-item-info">



        <div class="cart-item-title">

          ${item.title}

        </div>



        <div class="cart-item-price">

          ${(item.price * item.qty).toFixed(2)} ر.س

        </div>



      </div>



      <div class="cart-item-qty">



        <button class="qty-btn"

                onclick="changeQty(${idx}, -1)">

          −

        </button>



        <span class="qty-num">

          ${item.qty}

        </span>



        <button class="qty-btn"

                onclick="changeQty(${idx}, 1)">

          +

        </button>



      </div>



      <button class="cart-item-remove"

              onclick="removeItem(${idx})"

              title="حذف">



        <i class="fa-solid fa-xmark"></i>



      </button>



    </div>



  `).join("");



  const total = cart.reduce((s, i) => s + i.price * i.qty, 0);



  const count = cart.reduce((s, i) => s + i.qty, 0);



  document.getElementById("summaryCount").textContent =

    count + " منتج";



  document.getElementById("summaryTotal").textContent =

    total.toFixed(2) + " ر.س";



  summary.style.display = "block";



  updateCartCount();

}



function changeQty(idx, delta) {



  const cart = getCart();



  cart[idx].qty = Math.max(1, cart[idx].qty + delta);



  saveCart(cart);



  renderCartPage();

}



function removeItem(idx) {



  const cart = getCart();



  cart.splice(idx, 1);



  saveCart(cart);



  renderCartPage();

}



function clearCart() {



  saveCart([]);



  renderCartPage();

}



/* FINAL FIXED CHECKOUT */



function confirmOrder() {



  const cart = getCart();



  if (!cart.length) return;



  if (!user || !user.discordId) {



    window.location.href = "account.html";



    return;

  }



  if (cart.length > 1) {



    showNiceAlert("حالياً يمكنك شراء منتج واحد فقط بكل عملية");



    return;

  }



  const item = cart[0];



  const product = productsData.find(p => p.id === item.id);



  if (!product || !product.paypal) {



    showNiceAlert("رابط الدفع غير متوفر لهذا المنتج");



    return;

  }



  window.location.href = product.paypal;

}





/* PROFILE PANEL */
const profilePanel = document.getElementById("profilePanel");
const profilePanelOverlay = document.getElementById("profilePanelOverlay");

function openProfilePanel() {
  profilePanel.classList.add("open");
  profilePanelOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeProfilePanel() {
  profilePanel.classList.remove("open");
  profilePanelOverlay.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("profileIcon") && document.getElementById("profileIcon").addEventListener("click", () => {
  if (!user) { window.location.href = "account.html"; return; }
  openProfilePanel();
});

if (profilePanelOverlay) {
  profilePanelOverlay.addEventListener("click", closeProfilePanel);
}

const closePanelBtn = document.getElementById("closePanelBtn");
if (closePanelBtn) {
  closePanelBtn.addEventListener("click", closeProfilePanel);
}

// Render cart after DOM is ready
document.addEventListener("DOMContentLoaded", () => {
  renderCartPage();
});

</script>
