<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تمت العملية — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
</header>

<div style="min-height:100vh;display:grid;place-items:center;padding:calc(var(--header-h)+40px) 24px 60px;">
  <div style="text-align:center;max-width:560px;width:100%;">
    <div class="success-check">
      <i class="fa-solid fa-check" style="font-size:38px;color:#fff;"></i>
    </div>
    <h2 style="font-size:26px;margin:0 0 12px;color:#fff;background:none;-webkit-text-fill-color:#fff;">تمت عملية الدفع بنجاح 🎉</h2>
    <p style="color:var(--muted);margin:0 0 24px;">شكراً لثقتك بـ CA Store. يرجى فتح تذكرة في سيرفر الديسكورد لاستلام منتجك.</p>

    <div id="invoiceBox" style="display:none;"></div>

    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px;">
      <a href="orders.html" style="
        display:inline-flex;align-items:center;gap:8px;
        padding:13px 24px;border-radius:13px;
        background:linear-gradient(135deg,var(--brand),var(--brand-2));
        color:#fff;font-weight:700;
        box-shadow:0 10px 26px var(--brand-glow);
        transition:.25s var(--ease);">
        <i class="fa-solid fa-bag-shopping"></i> طلباتي
      </a>
      <a href="https://discord.gg/Pt7U4bcF7M" style="
        display:inline-flex;align-items:center;gap:8px;
        padding:13px 24px;border-radius:13px;
        background:#5865F2;color:#fff;font-weight:700;
        box-shadow:0 10px 26px rgba(88,101,242,.4);
        transition:.25s var(--ease);">
        <i class="fa-brands fa-discord"></i> افتح تذكرة
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="payment.js"></script>
</body>
</html>
