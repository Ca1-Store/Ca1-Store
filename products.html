<body>

<header>
  <a class="brand" href="index.html">

  <nav class="main-nav">

    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="products.html?cat=subscriptions" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="search-icon" id="searchToggle">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5 21.5 19 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </div>
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
    </div>
    <div class="cart-icon" id="cartBtn">

    </div>
    <div class="profile-icon" id="profileIcon">
      <svg viewBox="0 0 24 24"><path fill="white" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></svg>
    </div>
    <button class="signin-btn" id="signinBtn" onclick="window.location.href='account.html'">تسجيل الدخول</button>
  </div>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<!-- Profile Panel -->
<div class="profile-panel-overlay" id="profilePanelOverlay"></div>
<div class="profile-panel" id="profilePanel">
  <div class="panel-header">
    <div class="panel-title">الملف الشخصي</div>
    <button class="panel-close" id="closePanelBtn">✕</button>
  </div>
  <div class="panel-avatar-section">
    <div class="panel-avatar" id="panelAvatar">CA</div>
    <div class="panel-name" id="panelName">مستخدم CA</div>
    <div class="panel-email" id="panelEmail">غير مسجّل</div>
  </div>
  <nav class="panel-nav">
    <a href="profile.html" class="panel-link">
      <i class="fa-solid fa-user"></i>
      <span>حسابي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="orders.html" class="panel-link">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>طلباتي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="settings.html" class="panel-link">
      <i class="fa-solid fa-gear"></i>
      <span>الإعدادات</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="subscriptions.html" class="panel-link">
      <i class="fa-solid fa-crown"></i>
      <span>اشتراكاتي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
  </nav>
  <div class="panel-footer">
    <button class="panel-logout" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
      تسجيل الخروج
    </button>
  </div>
</div>

<!-- Hidden for JS compatibility -->
<div class="profile-dropdown" id="profileDropdown" style="display:none;"></div>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="products.html?cat=fivem">منتجات فايف إم</a>
  <a href="products.html?cat=discord">منتجات الديسكورد</a>
  <a href="subscriptions.html">الاشتراكات</a>
  <a href="terms.html">الشروط والأحكام</a>
  <a href="https://discord.gg/Pt7U4bcF7M">سيرفر الديسكورد</a>
</div>

<div class="products-page">
  <aside class="sidebar">
    <h3><i class="fa-solid fa-sliders" style="color:var(--brand-light);margin-left:8px;font-size:13px;"></i> تصفية المنتجات</h3>
    <div class="filter-group">
      <label>القسم</label>
      <select id="filterCategory">
        <option value="all">كل الأقسام</option>
        <option value="fivem">فايف إم</option>
        <option value="discord">ديسكورد</option>
        <option value="subscriptions">الاشتراكات</option>
        <option value="support">دعم المتجر</option>
      </select>
    </div>
    <div class="filter-group">
      <label>السعر</label>
      <select id="filterPrice">
        <option value="all">كل الأسعار</option>
        <option value="low">أقل من 20</option>
        <option value="mid">من 20 إلى 50</option>
        <option value="high">أعلى من 50</option>
      </select>
    </div>
    <div class="filter-group">
      <label>الحالة</label>
      <select id="filterStatus">
        <option value="all">الكل</option>
        <option value="available">متاح</option>
        <option value="soon">قريبًا</option>
      </select>
    </div>
  </aside>
  <div class="products-grid" id="productsGrid"></div>
</div>

<div id="niceAlert" class="nice-alert">تمت إضافة المنتج للسلة</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="script.min.js"></script>
<script>
/* ── Nav active state: detect cat from URL ── */
(function() {
  const cat = new URLSearchParams(window.location.search).get("cat");
  document.querySelectorAll(".nav-link").forEach(a => a.classList.remove("active"));
  if (cat) {
    document.querySelectorAll(".nav-link").forEach(a => {
      const h = a.getAttribute("href") || "";
      if (h.includes("cat=" + cat)) a.classList.add("active");
    });
  }
})();

const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user || !user.discordId) {
  document.getElementById("signinBtn").style.display = "";
  document.getElementById("profileIcon").style.display = "none";
} else {
  document.getElementById("signinBtn").style.display = "none";
  document.getElementById("panelEmail").textContent = user.username || "Discord User";
  if (user.username) document.getElementById("panelName").textContent = user.username;
  if (user.avatar) {
    document.getElementById("panelAvatar").innerHTML = `<img src="${user.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
  } else {
    const initials = (user.username || "CA").slice(0,2).toUpperCase();
    document.getElementById("panelAvatar").textContent = initials;
  }
}

const _profilePanel = document.getElementById("profilePanel");
const _profilePanelOverlay = document.getElementById("profilePanelOverlay");

document.getElementById("profileIcon") && document.getElementById("profileIcon").addEventListener("click", () => {
  if (!user) { window.location.href = "account.html"; return; }
  _profilePanel.classList.add("open");
  _profilePanelOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
});
_profilePanelOverlay.addEventListener("click", () => {
  _profilePanel.classList.remove("open");
  _profilePanelOverlay.classList.remove("open");
  document.body.style.overflow = "";
});
document.getElementById("closePanelBtn").addEventListener("click", () => {
  _profilePanel.classList.remove("open");
  _profilePanelOverlay.classList.remove("open");
  document.body.style.overflow = "";
});

function logout() {
  localStorage.removeItem("loggedUser");
  window.location.href = "account.html";
}
window.addEventListener("load", () => {
  if (typeof applyFilters === "function") applyFilters();
});
document.addEventListener("DOMContentLoaded", () => {

  const urlCat = new URLSearchParams(window.location.search).get("cat");
  const filterCategory = document.getElementById("filterCategory");

  if (urlCat) {
    filterCategory.value = urlCat;
  }

  if (typeof applyFilters === "function") {
    applyFilters();
  }

});
</script>
</body>
</html>
