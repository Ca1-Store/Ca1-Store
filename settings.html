<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الإعدادات — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="profile.html" class="nav-link">حسابي</a>
    <a href="orders.html" class="nav-link">طلباتي</a>
  </nav>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="profile.html">حسابي</a>
  <a href="orders.html">طلباتي</a>
</div>

<div class="settings-page">
  <div class="settings-box">
    <h2>الإعدادات</h2>
    <p class="settings-desc">
      يمكنك من هنا إدارة حسابك. تنبيه: حذف الحساب لا يمكن التراجع عنه، وستُفقد جميع بياناتك وطلباتك نهائياً.
    </p>
    <button class="disable-btn" onclick="showConfirm()">
      <i class="fa-solid fa-trash-can"></i> حذف الحساب
    </button>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay" style="display:flex;">
  <div class="confirm-box" style="display:none;" id="confirmBox">
    <h3>⚠️ تأكيد الحذف</h3>
    <p>هل أنت متأكد؟ لا يمكن التراجع عن هذا الإجراء.</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="hideConfirm()">إلغاء</button>
      <button class="btn-delete" onclick="deleteAccount()">حذف الحساب</button>
    </div>
  </div>
</div>
<style>
#confirmOverlay { display:none; }
#confirmOverlay.show { display:flex; }
#confirmBox { display:block !important; }
</style>

<div class="toast-success" id="toastSuccess">تم الحذف بنجاح ✓</div>

<script src="script.min.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user) { window.location.href = "account.html"; }

function showConfirm() {
  document.getElementById("confirmOverlay").classList.add("show");
}
function hideConfirm() {
  document.getElementById("confirmOverlay").classList.remove("show");
}
function deleteAccount() {
  localStorage.removeItem("loggedUser");
  sessionStorage.clear();
  const t = document.getElementById("toastSuccess");
  t.classList.add("show");
  setTimeout(() => { window.location.href = "account.html"; }, 1800);
}
</script>
</body>
</html>
