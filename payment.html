<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدفع — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <div class="header-actions">
    <a onclick="goBackProperly()" class="back-btn" style="cursor:pointer;">
      <i class="fa-solid fa-arrow-right"></i> رجوع
    </a>
  </div>
</header>

<div style="min-height:100vh;display:grid;place-items:center;padding:calc(var(--header-h)+40px) 24px 60px;">
  <div class="paypal-box">
    <div style="font-size:32px;margin-bottom:16px;">💳</div>
    <div id="priceInfo">جاري التحميل...</div>
    <div id="usdInfo"></div>
    <div id="loadingText">جاري تهيئة بوابة الدفع...</div>
    <div id="paypal-button-container"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="payment.js"></script>
<script>
function goBackProperly() {
  const ref = document.referrer;
  if (ref && ref.includes("checkout")) { window.location.href = "checkout.html"; }
  else { history.back(); }
}
</script>
</body>
</html>
