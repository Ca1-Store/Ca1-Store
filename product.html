<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>تفاصيل المنتج — CA Store</title>

  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<header>

  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>

  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="products.html?cat=subscriptions" class="nav-link">الاشتراكات</a>
  </nav>

  <div class="header-actions">

    <div class="search-icon" id="searchToggle">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5 21.5 19 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </div>

    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
    </div>

    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24">
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42Z"/>
      </svg>
    </div>

    <div class="profile-icon" id="profileIcon">
      <svg viewBox="0 0 24 24">
        <path fill="white" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/>
      </svg>
    </div>

    <button class="signin-btn" id="signinBtn" onclick="window.location.href='account.html'">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15zM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69z"/>
      </svg>
      تسجيل الدخول
    </button>

  </div>

  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
    </svg>
  </div>

</header>

<div class="profile-dropdown" id="profileDropdown" style="display:none;"></div>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الرئيسية</a>
  <a href="products.html?cat=fivem">فايف إم</a>
  <a href="products.html?cat=discord">ديسكورد</a>
  <a href="products.html?cat=subscriptions">الاشتراكات</a>
</div>

<div class="product-page">

  <div class="product-image-box">
    <img id="productImage" src="">
  </div>

  <div class="product-info-box">

    <h1 id="productTitle">جاري التحميل...</h1>
    <p id="productDesc"></p>
    <div class="price-box" id="productPrice"></div>

    <button id="buyNowBtn">شراء الآن</button>
    <button id="addToCartBtn">إضافة للسلة</button>

    <div id="notAvailable" style="display:none;">المنتج غير متوفر</div>

    <div class="product-reviews">
      <h3>التقييمات</h3>
      <div id="productReviews"></div>
    </div>

  </div>

</div>

<div id="niceAlert" class="nice-alert"></div>

<script src="script.min.js"></script>
<script src="product.js"></script>

<!--  FIXED HEADER LOGIC  -->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const user = JSON.parse(localStorage.getItem("loggedUser") || "null");

  const signinBtn = document.getElementById("signinBtn");
  const profileIcon = document.getElementById("profileIcon");

  if (user && user.discordId) {
    signinBtn.style.display = "none";
    profileIcon.style.display = "flex";
  } else {
    signinBtn.style.display = "block";
    profileIcon.style.display = "none";
  }

  // SIDE MENU FIX
  const btn = document.getElementById("sideMenuBtn");
  const menu = document.getElementById("sideMenu");

  btn?.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove("open");
    }
  });

  // PROFILE CLICK FIX
  const profile = document.getElementById("profileIcon");
  const dropdown = document.getElementById("profileDropdown");

  profile?.addEventListener("click", () => {
    const user = JSON.parse(localStorage.getItem("loggedUser") || "null");

    if (!user) {
      window.location.href = "account.html";
      return;
    }

    dropdown.classList.toggle("show");
  });

});
</script>

</body>
</html>
