<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="subscriptions.html" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="search-icon" id="searchToggle">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5 21.5 19 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </div>
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
    </div>
    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42a.25.25 0 0 1-.26-.25c0-.04.01-.08.03-.11L7.16 14Z"/></svg>
    </div>
    <div class="profile-icon" id="profileIcon">
      <svg viewBox="0 0 24 24"><path fill="white" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></svg>
    </div>
    <button class="signin-btn" id="signinBtn" onclick="window.location.href='account.html'">تسجيل الدخول</button>
  </div>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<!-- Profile Panel -->
<div class="profile-panel-overlay" id="profilePanelOverlay"></div>
<div class="profile-panel" id="profilePanel">
  <div class="panel-header">
    <div class="panel-title">الملف الشخصي</div>
    <button class="panel-close" id="closePanelBtn">✕</button>
  </div>
  <div class="panel-avatar-section">
    <div class="panel-avatar" id="panelAvatar">CA</div>
    <div class="panel-name" id="panelName">مستخدم CA</div>
    <div class="panel-email" id="panelEmail">غير مسجّل</div>
  </div>
  <nav class="panel-nav">
    <a href="profile.html" class="panel-link">
      <i class="fa-solid fa-user"></i>
      <span>حسابي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="orders.html" class="panel-link">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>طلباتي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="settings.html" class="panel-link">
      <i class="fa-solid fa-gear"></i>
      <span>الإعدادات</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="subscriptions.html" class="panel-link">
      <i class="fa-solid fa-crown"></i>
      <span>اشتراكاتي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
  </nav>
  <div class="panel-footer">
    <button class="panel-logout" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
      تسجيل الخروج
    </button>
  </div>
</div>

<!-- Hidden for JS compatibility -->
<div class="profile-dropdown" id="profileDropdown" style="display:none;"></div>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="products.html?cat=fivem">منتجات فايف إم</a>
  <a href="products.html?cat=discord">منتجات الديسكورد</a>
  <a href="subscriptions.html">الاشتراكات</a>
  <a href="terms.html">الشروط والأحكام</a>
</div>

<a onclick="history.back()" class="back-btn-fixed" style="cursor:pointer;">
  <i class="fa-solid fa-arrow-right"></i> رجوع
</a>

<div class="product-page">
  <div>
    <div class="product-image-box">
      <img id="productImage" src="" alt="صورة المنتج">
    </div>
  </div>
  <div class="product-info-box">
    <h1 id="productTitle">جاري التحميل...</h1>
    <p id="productDesc"></p>
    <div class="price-box" id="productPrice"></div>
    <button id="buyNowBtn" style="display:none;">شراء الآن</button>
    <div id="notAvailable" style="display:none;">⏳ هذا المنتج غير متاح حالياً</div>
  </div>
</div>

<div id="niceAlert" class="nice-alert"></div>

<!-- script.min.js MUST load before product.js (defines productsData) -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="Email.JS"></script>
<script src="script.min.js"></script>
<script src="product.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user || !user.email) {
  document.getElementById("signinBtn").style.display = "";
  document.getElementById("profileIcon") && (document.getElementById("profileIcon").style.display = "none");
} else {
  document.getElementById("signinBtn").style.display = "none";
  document.getElementById("panelEmail").textContent = user.email;
  if (user.name) document.getElementById("panelName").textContent = user.name;
  const initials = (user.name || user.email).slice(0,2).toUpperCase();
  document.getElementById("panelAvatar").textContent = initials;
}

const profileIcon = document.getElementById("profileIcon");
const profilePanel = document.getElementById("profilePanel");
const profilePanelOverlay = document.getElementById("profilePanelOverlay");

if (profileIcon) {
  profileIcon.addEventListener("click", () => {
    if (!user) { window.location.href = "account.html"; return; }
    profilePanel.classList.add("open");
    profilePanelOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
  });
}
profilePanelOverlay.addEventListener("click", () => {
  profilePanel.classList.remove("open");
  profilePanelOverlay.classList.remove("open");
  document.body.style.overflow = "";
});
document.getElementById("closePanelBtn").addEventListener("click", () => {
  profilePanel.classList.remove("open");
  profilePanelOverlay.classList.remove("open");
  document.body.style.overflow = "";
});

function logout() {
  localStorage.removeItem("loggedUser");
  window.location.href = "account.html";
}
</script>
</body>
</html>
