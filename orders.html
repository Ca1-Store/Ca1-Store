<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="subscriptions.html" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42a.25.25 0 0 1-.26-.25c0-.04.01-.08.03-.11L7.16 14Z"/></svg>
    </div>
  </div>
  <div class="side-menu-btn" id="sideMenuBtn">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </div>
</header>

<div id="sideMenu" class="side-menu">
  <a href="index.html">الصفحة الرئيسية</a>
  <a href="profile.html">حسابي</a>
  <a href="settings.html">الإعدادات</a>
</div>

<div class="profile-page">
  <div class="profile-box">
    <h2>طلباتي</h2>
    <div id="ordersList" class="ordersList">
      <div class="orders-empty-box">
        <i class="fa-solid fa-box-open" style="font-size:48px;color:var(--muted);margin-bottom:16px;display:block;"></i>
        <h2>لا توجد طلبات بعد</h2>
        <p>بعد إتمام أي عملية شراء ستظهر طلباتك هنا.</p>
        <br>
        <a href="products.html" style="
          display:inline-flex;align-items:center;gap:8px;
          padding:12px 24px;border-radius:12px;
          background:linear-gradient(135deg,var(--brand),var(--brand-2));
          color:#fff;font-weight:700;
          box-shadow:0 10px 26px var(--brand-glow);
          transition:.25s var(--ease);">
          تصفح المنتجات
        </a>
      </div>
    </div>
  </div>
</div>

<script src="script.min.js"></script>
<script>
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user) { window.location.href = "account.html"; }
else {
  const orders = JSON.parse(localStorage.getItem(`orders_${user.email}`) || "[]");
  if (orders.length > 0) {
    const list = document.getElementById("ordersList");
    list.innerHTML = "";
    orders.reverse().forEach(o => {
      list.innerHTML += `
        <div class="order-card">
          <h3 class="order-title">${o.productName || o.name || "طلب"}</h3>
          <p><strong>التاريخ:</strong> ${o.date || "—"}</p>
          <p><strong>المبلغ:</strong> ${o.amount || o.price || "—"}</p>
          ${o.code ? `<div class="order-code-box"><p><strong>الكود / الرمز:</strong> ${o.code}</p></div>` : ""}
        </div>`;
    });
  }
}
</script>
</body>
</html>
