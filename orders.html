<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طلباتي — CA Store</title>
  <link rel="icon" href="Copilot_20260330_010158.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <a class="brand" href="index.html">
    <div class="brand-logo">CA</div>
    <span class="brand-name">CA STORE</span>
  </a>
  <nav class="main-nav">
    <a href="index.html" class="nav-link">الرئيسية</a>
    <a href="products.html?cat=fivem" class="nav-link">فايف إم</a>
    <a href="products.html?cat=discord" class="nav-link">ديسكورد</a>
    <a href="subscriptions.html" class="nav-link">الاشتراكات</a>
  </nav>
  <div class="header-actions">
    <div class="search-icon" id="searchToggle">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 20.5 21.5 19 15.5 14Zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14Z"/></svg>
    </div>
    <div class="search-box" id="searchBox">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
    </div>
    <div class="cart-icon" id="cartBtn">
      <span class="cart-count" id="cartCount">0</span>
      <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2Zm10 0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2ZM7.16 14h9.93c.75 0 1.4-.41 1.73-1.03L21.8 7.48A.75.75 0 0 0 21.12 6H6.21L5.27 3.5A1 1 0 0 0 4.33 3H3v2h.67l3 7.59-.76 1.41C5.37 14.37 5 15.03 5 15.75 5 16.99 5.96 18 7.16 18H19v-2H7.42a.25.25 0 0 1-.26-.25c0-.04.01-.08.03-.11L7.16 14Z"/></svg>
    </div>
    <div class="profile-icon" id="profileIcon">
      <svg viewBox="0 0 24 24"><path fill="white" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4Zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4Z"/></svg>
    </div>
    <button class="signin-btn" id="signinBtn" onclick="window.location.href='account.html'">تسجيل الدخول</button>
  </div>
</header>

<!-- Profile Panel -->
<div class="profile-panel-overlay" id="profilePanelOverlay"></div>
<div class="profile-panel" id="profilePanel">
  <div class="panel-header">
    <div class="panel-title">الملف الشخصي</div>
    <button class="panel-close" id="closePanelBtn">✕</button>
  </div>
  <div class="panel-avatar-section">
    <div class="panel-avatar" id="panelAvatar">CA</div>
    <div class="panel-name" id="panelName">مستخدم CA</div>
    <div class="panel-email" id="panelEmail">غير مسجّل</div>
  </div>
  <nav class="panel-nav">
    <a href="profile.html" class="panel-link">
      <i class="fa-solid fa-user"></i>
      <span>حسابي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="orders.html" class="panel-link">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>طلباتي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="settings.html" class="panel-link">
      <i class="fa-solid fa-gear"></i>
      <span>الإعدادات</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
    <a href="products.html?cat=subscriptions" class="panel-link">
      <i class="fa-solid fa-crown"></i>
      <span>اشتراكاتي</span>
      <i class="fa-solid fa-chevron-left panel-chevron"></i>
    </a>
  </nav>
  <div class="panel-footer">
    <button class="panel-logout" onclick="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
      تسجيل الخروج
    </button>
  </div>
</div>

<!-- Hidden for JS compatibility -->
<div class="profile-dropdown" id="profileDropdown" style="display:none;"></div>

<div class="orders-page">
  <!-- Orders Header with Stats -->
  <div class="orders-header">
    <h1><i class="fa-solid fa-bag-shopping"></i> طلباتي</h1>
    <p>تتبع جميع طلباتك وتفاصيل الشراء</p>
  </div>

  <!-- Stats Section -->
  <div class="orders-stats">
    <div class="stat-card">
      <i class="fa-solid fa-shopping-cart"></i>
      <div class="stat-info">
        <span class="stat-value" id="statTotalOrders">0</span>
        <span class="stat-label">إجمالي الطلبات</span>
      </div>
    </div>
    <div class="stat-card">
      <i class="fa-solid fa-wallet"></i>
      <div class="stat-info">
        <span class="stat-value" id="statTotalSpending">0 ر.س</span>
        <span class="stat-label">إجمالي الإنفاق</span>
      </div>
    </div>
  </div>

  <!-- Orders List -->
  <div class="orders-section">
    <div id="ordersList" class="orders-list">
      <div class="orders-empty-box">
        <i class="fa-solid fa-box-open"></i>
        <h2>لا توجد طلبات بعد</h2>
        <p>بعد إتمام أي عملية شراء ستظهر طلباتك هنا.</p>
        <a href="products.html" class="browse-products-btn">
          <i class="fa-solid fa-store"></i>
          تصفح المنتجات
        </a>
      </div>
    </div>
  </div>
</div>

<script src="script.min.js"></script>
<script>
// Check if user is logged in
const user = JSON.parse(localStorage.getItem("loggedUser") || "null");
if (!user) { 
  window.location.href = "account.html"; 
} else {
  // Show/hide signin button and profile icon
  if (!user || !user.email) {
    document.getElementById("signinBtn").style.display = "";
    document.getElementById("profileIcon").style.display = "none";
  } else {
    document.getElementById("signinBtn").style.display = "none";
  }
  
  // Update profile panel
  const displayName = user.name || user.email || 'CA';
  document.getElementById("panelAvatar").textContent = displayName.slice(0, 2).toUpperCase();
  document.getElementById("panelName").textContent = user.name || 'مستخدم CA';
  document.getElementById("panelEmail").textContent = user.email || 'غير مسجّل';
  
  // Get orders from localStorage
  const orders = JSON.parse(localStorage.getItem(`orders_${user.email}`) || "[]");
  
  // Update stats
  document.getElementById("statTotalOrders").textContent = orders.length;
  
  // Calculate total spending
  let totalSpending = 0;
  orders.forEach(order => {
    if (order.amount) {
      const amount = parseFloat(order.amount.replace(/[^\d.]/g, '')) || 0;
      totalSpending += amount;
    }
  });
  document.getElementById("statTotalSpending").textContent = totalSpending.toFixed(2) + " ر.س";
  
  // Render orders
  if (orders.length > 0) {
    const list = document.getElementById("ordersList");
    list.innerHTML = "";
    orders.reverse().forEach((o, index) => {
      const orderDate = o.date || "—";
      const orderAmount = o.amount || o.price || "—";
      const orderCode = o.code || "";
      const orderProduct = o.productName || o.name || "طلب";
      const orderId = o.id || `ORD-${index + 1}`;
      
      list.innerHTML += `
        <div class="order-card">
          <div class="order-card-header">
            <div class="order-id">
              <i class="fa-solid fa-receipt"></i>
              <span>${orderId}</span>
            </div>
            <div class="order-date">
              <i class="fa-solid fa-calendar"></i>
              <span>${orderDate}</span>
            </div>
          </div>
          <div class="order-card-body">
            <h3 class="order-product">${orderProduct}</h3>
            <div class="order-details">
              <div class="order-detail">
                <i class="fa-solid fa-money-bill-wave"></i>
                <span>المبلغ: <strong>${orderAmount}</strong></span>
              </div>
              ${o.qty ? `
              <div class="order-detail">
                <i class="fa-solid fa-cubes"></i>
                <span>الكمية: <strong>${o.qty}</strong></span>
              </div>
              ` : ""}
            </div>
            ${orderCode ? `
            <div class="order-code-section">
              <div class="order-code-label">
                <i class="fa-solid fa-key"></i>
                <span>الكود / الرمز:</span>
              </div>
              <div class="order-code-value">
                <code>${orderCode}</code>
                <button onclick="copyToClipboard('${orderCode}')" class="copy-btn">
                  <i class="fa-solid fa-copy"></i>
                </button>
              </div>
            </div>
            ` : ""}
          </div>
        </div>`;
    });
  }
}

// Copy to clipboard function
function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    // Show toast notification
    const toast = document.createElement('div');
    toast.className = 'copy-toast';
    toast.innerHTML = '<i class="fa-solid fa-check"></i> تم نسخ الكود';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  });
}

// Profile Panel Functions
const profilePanel = document.getElementById("profilePanel");
const profilePanelOverlay = document.getElementById("profilePanelOverlay");

function openProfilePanel() {
  profilePanel.classList.add("open");
  profilePanelOverlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeProfilePanel() {
  profilePanel.classList.remove("open");
  profilePanelOverlay.classList.remove("open");
  document.body.style.overflow = "";
}

document.getElementById("profileIcon") && document.getElementById("profileIcon").addEventListener("click", () => {
  if (!user) { window.location.href = "account.html"; return; }
  openProfilePanel();
});

profilePanelOverlay.addEventListener("click", closeProfilePanel);
document.getElementById("closePanelBtn").addEventListener("click", closeProfilePanel);

// Logout function
function logout() {
  localStorage.removeItem("loggedUser");
  window.location.href = "account.html";
}
</script>
</body>
</html>
